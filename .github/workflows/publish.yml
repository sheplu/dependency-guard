name: Publish Package

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: OSV Scan
        continue-on-error: ${{ vars.ALLOW_OSV_FAILURE == 'true' }}
        env:
          OSV_VERSION: 2.3.6
          OSV_SHA256: e6ab0955cc906f308704575a608d28e55068d00c7fa7f47797131c89b30c0373
        run: |
          set -euo pipefail
          curl -sSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_arm64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --lockfile=package-lock.json

      - name: Audit
        continue-on-error: ${{ vars.ALLOW_AUDIT_FAILURE == 'true' }}
        run: |
          npm audit --audit-level=low

      - name: Lint
        run: |
          npm run lint

      - name: Typecheck
        run: |
          npm run typecheck

      - name: Build
        run: |
          npm run build

      - name: Test
        run: |
          npm run test:coverage

      - name: Publish Dry Run
        run: |
          npm pack --dry-run

  publish:
    name: Publish to npm
    needs: quality-gate
    runs-on: ubuntu-24.04-arm
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Set version from release tag
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Build
        run: |
          npm run build

      - name: Publish
        run: |
          npm publish --ignore-scripts --access public --provenance
